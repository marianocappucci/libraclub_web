services:
  web:
    build: .
    image: libraclub-web:latest
    container_name: libraclub-web
    restart: unless-stopped
    environment:
      - AUTH_UPSTREAM=libraclub-web-auth
    ports:
      - "127.0.0.1:8101:80"
    networks:
      - stack-net
    depends_on:
      - auth

  auth:
    build:
      context: ./auth
      ssh:
        - default=${LIBRA_WEB_KIT_SSH_KEY:-~/.ssh/id_ed25519_libra_web_kit}
    image: libraclub-web-auth:latest
    container_name: libraclub-web-auth
    restart: unless-stopped
    environment:
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      - DOCS_SESSION_SECRET=${DOCS_SESSION_SECRET:-libraclub-docs-secret-change-me}
      - APEX_DOMAIN=${APEX_DOMAIN:-libraclub.com.ar}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
